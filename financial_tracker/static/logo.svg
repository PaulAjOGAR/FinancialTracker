<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c97a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2738;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon background circle -->
  <rect x="0" y="4" width="52" height="52" rx="12" fill="url(#bgGrad)"/>

  <!-- Gold accent top bar on icon -->
  <rect x="0" y="4" width="52" height="3" rx="2" fill="url(#iconGrad)"/>

  <!-- Bar chart icon -->
  <rect x="10" y="32" width="7" height="16" rx="2" fill="url(#iconGrad)" opacity="0.6"/>
  <rect x="20" y="24" width="7" height="24" rx="2" fill="url(#iconGrad)" opacity="0.8"/>
  <rect x="30" y="17" width="7" height="31" rx="2" fill="url(#iconGrad)"/>

  <!-- Trend line over bars -->
  <polyline points="13,30 23,22 33,15 43,11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="43" cy="11" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- "Finance" text -->
  <text x="64" y="30"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="700"
        fill="#0f1923"
        letter-spacing="-0.3">Finance</text>

  <!-- "Tracker" text -->
  <text x="64" y="50"
        font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="500"
        fill="#c9a84c"
        letter-spacing="3.5">TRACKER</text>

  <!-- Vertical divider between words -->
  <line x1="60" y1="12" x2="60" y2="55" stroke="#e2d9cc" stroke-width="1"/>
</svg>